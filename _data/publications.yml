    code: "https://github.com/junyuchen245/ViT-V-Net_for_3D_Image_Registration"
  image: "pubs/ViT-V-Net.jpg"
  image_full: "ViT-V-Net.jpg"
  abstract: >-
    We present ViT-V-Net that bridges Vision Transformer and V-Net for volumetric medical image registration.
    The experimental results demonstrate that the proposed architecture achieves superior performance to
    several state-of-the-art registration methods.

- title: "DeepAMO: A multi-slice, multi-view anthropomorphic model observer for visual detection tasks performed on volume images"
  authors: "Ye Li, Junyu Chen, Justin L. Brown, S. Ted Treves, Xinhua Cao, Frederic H. Fahey, George Sgouros, Wesley E. Bolch, Eric C. Frey"
  venue: "Journal of Medical Imaging, special section on Perspectives in Human and Model Observer Performance"
  venue_short: "JMI"
  year: 2021
  type: journal
  links:
    paper: "https://www.spiedigitallibrary.org/journals/journal-of-medical-imaging/volume-8/issue-4/041204/DeepAMO--a-multi-slice-multi-view-anthropomorphic-model-observer/10.1117/1.JMI.8.4.041204.short"
    pdf: "/files/041204_1.pdf"
    code: "http://garyliye.com/deepAMO.zip"
  image: "pubs/DeepAMO_profile_pic.jpg"
  image_full: "DeepAMO_profile_pic.png"
  abstract: >-
    We have developed a deep learning-based anthropomorphic model observer (DeepAMO) for image quality
    evaluation of multi-orientation, multi-slice image sets with respect to a clinically realistic 3D defect
    detection task. The input to the DeepAMO is a composite image, typical of that used to view 3D volumes in
    clinical practice. The output is a rating value designed to mimic human observer's defect detection
    performance. The main contributions of this paper are threefold. First, we propose a hypothetical model of
    the decision process of a reader performing a detection task using a 3D volume. Second, we propose a
    projection-based defect confirmation network architecture to confirm defect present in two different
    slicing orientations. Third, we propose a novel calibration method that 'learns' the underlying
    distribution of observer ratings from the human observer rating data (thus modeling inter- or intra-
    observer variability) using a Mixture Density Network.

- title: "Generating anthropomorphic phantoms using fully unsupervised deformable image registration with convolutional neural networks"
  authors: "Junyu Chen, Ye Li, Yong Du, Eric C. Frey"
  venue: "Medical Physics"
  venue_short: "Med Phys"
  year: 2020
  type: journal
  note: "Editor's Choice"
  links:
    paper: "https://aapm.onlinelibrary.wiley.com/doi/abs/10.1002/mp.14545"
    pdf: "https://aapm.onlinelibrary.wiley.com/doi/epdf/10.1002/mp.14545"
    code: "https://github.com/junyuchen245/Fully_Unsupervised_CNN_Registration_Keras"
  image: "pubs/MedPhy_phantom.jpg"
  image_full: "MedPhy_phantom.jpg"
  abstract: >-
    We treat the CNN as an optimization tool that iteratively minimizes the loss function via
    reparametrization in each iteration. This means that the algorithm is fully unsupervised and thus no prior
    training is required. We generate phantom variations by warping an XCAT phantom to capture the anatomical
    variations within real human CT images.

- title: "Medical image segmentation via unsupervised convolutional neural network"
  authors: "Junyu Chen, Eric C. Frey"
  venue: "Medical Imaging with Deep Learning (MIDL)"
  venue_short: "MIDL"
  year: 2020
  type: conference
  links:
    paper: "https://openreview.net/forum?id=XrbnSCv4LU"
    pdf: "https://openreview.net/pdf?id=XrbnSCv4LU"
    code: "https://github.com/junyuchen245/Unsuprevised_Seg_via_CNN"
  image: "pubs/UnsupCNNSeg.jpg"
  image_full: "UnsupCNNSeg.jpg"
  abstract: >-
    For the majority of the learning-based segmentation methods, a large quantity of high-quality training data
    is required. In this paper, we present a novel learning-based segmentation model that could be trained
    semi- or un-supervised. Specifically, in the unsupervised setting, we parameterize the Active contour
    without edges (ACWE) framework via a convolutional neural network (ConvNet), and optimize the parameters of
    the ConvNet using a self-supervised method. In another setting (semi-supervised), the auxiliary
    segmentation ground truth is used during training. We show that the method provides fast and high-quality
    bone segmentation in the context of single-photon emission computed tomography (SPECT) image.

- title: "Incorporating CT prior information in the robust fuzzy C-means algorithm for QSPECT image segmentation"
  authors: "Junyu Chen, Abhinav K. Jha, Eric C. Frey"
  venue: "SPIE Medical Imaging: Image Processing"
  venue_short: "SPIE MI"
  year: 2019
  type: conference
  links:
    paper: "https://www.spiedigitallibrary.org/conference-proceedings-of-spie/10949/109491W/Incorporating-CT-prior-information-in-the-robust-fuzzy-C-means/10.1117/12.2506805.short"
    pdf: "/files/109491W.pdf"
    code: "https://github.com/junyuchen245/SPECT-CT-Seg-RFCM"
  image: "pubs/RFCM_Seg.jpg"
  image_full: "RFCM_Seg.jpg"
  abstract: >-
    We propose and evaluate a fuzzy C-means (FCM) clustering based semi-automatic segmentation method on
    quantitative Tc-99m MDP quantitative SPECT/CT. We propose to incorporate information from registered CT
    images, which can be used to segment normal bones quite readily, into the FCM segmentation algorithm. The
    proposed method modifies the objective function of the robust fuzzy C-means (RFCM) method to include prior
    information about bone from CT images and spatial information from the SPECT image to allow for
    simultaneously segmenting lesion and bone in BQSPECT/CT images.
