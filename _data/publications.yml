- title: "Beyond the LUMIR challenge: The pathway to foundational registration models"
  authors: "Junyu Chen, Shuwen Wei, Joel Honkamaa, Pekka Marttinen, Hang Zhang, Min Liu, Yichao Zhou, Zuopeng Tan, Zhuoyuan Wang, Yi Wang, Hongchao Zhou, Shunbo Hu, Yi Zhang, Qian Tao, Lukas Förner, Thomas Wendler, Bailiang Jian, Benedikt Wiestler, Tim Hable, Jin Kim, Dan Ruan, Frederic Madesta, Thilo Sentker, Wiebke Heyer, Lianrui Zuo, Yuwei Dai, Jing Wu, Jerry L. Prince, Harrison Bai, Yong Du, Yihao Liu, Alessa Hering, Reuben Dorent, Lasse Hansen, Mattias P. Heinrich, Aaron Carass"
  venue: "Medical Image Analysis"
  venue_short: "MedIA"
  year: 2026
  type: journal
  links:
    paper: "https://www.sciencedirect.com/science/article/pii/S1361841526002446"
    pdf: "https://arxiv.org/abs/2505.24160"
    code: "https://github.com/JHU-MedImage-Reg/LUMIR_L2R"
    project: "https://learn2reg.grand-challenge.org/"
  image: "pubs/lumir.jpg"
  image_full: "pubs/lumir_full.jpg"
  selected: true
  abstract: >-
    Medical image challenges have played a transformative role in advancing the field, catalyzing innovation
    and establishing new performance benchmarks. Image registration, a foundational task in neuroimaging, has
    similarly advanced through the Learn2Reg initiative. Building on this, we introduce the Large-scale
    Unsupervised Brain MRI Image Registration (LUMIR) challenge, a next-generation benchmark for unsupervised
    brain MRI registration. Previous challenges relied upon anatomical label maps, however LUMIR provides 4,014
    unlabeled T1-weighted MRIs for training, encouraging biologically plausible deformation modeling through
    self-supervision. Evaluation includes 590 in-domain test subjects and extensive zero-shot tasks across
    disease populations, imaging protocols, and species. Deep learning methods consistently achieved
    state-of-the-art performance and produced anatomically plausible, diffeomorphic deformation fields. They
    outperformed several leading optimization-based methods and remained robust to most domain shifts. These
    findings highlight the growing maturity of deep learning in neuroimaging registration and its potential to
    serve as a foundation model for general-purpose medical image registration.

- title: "Unsupervised learning of spatially varying regularization for diffeomorphic image registration"
  authors: "Junyu Chen, Shuwen Wei, Yihao Liu, Zhangxing Bian, Yufan He, Aaron Carass, Harrison Bai, Yong Du"
  venue: "Medical Image Analysis"
  venue_short: "MedIA"
  year: 2025
  type: journal
  links:
    paper: "https://www.sciencedirect.com/science/article/pii/S1361841525004335"
    pdf: "https://arxiv.org/pdf/2412.17982"
    code: "https://github.com/junyuchen245/Spatially-Varying-Regularization-ImgReg"
  image: "pubs/Spatially_varying_reg.jpg"
  image_full: "Spatially_varying_reg.jpg"
  selected: true
  abstract: >-
    Spatially varying regularization accommodates the deformation variations that may be necessary for
    different anatomical regions during deformable image registration. Historically, optimization-based
    registration models have harnessed spatially varying regularization to address anatomical subtleties.
    However, most modern deep learning-based models tend to gravitate towards spatially invariant
    regularization, wherein a homogenous regularization strength is applied across the entire image,
    potentially disregarding localized variations. In this paper, we propose a hierarchical probabilistic model
    that integrates a prior distribution on the deformation regularization strength, enabling the end-to-end
    learning of a spatially varying deformation regularizer directly from the data. The proposed method is
    straightforward to implement and easily integrates with various registration network architectures.
    Additionally, automatic tuning of hyperparameters is achieved through Bayesian optimization, allowing
    efficient identification of optimal hyperparameters for any given registration task. Comprehensive
    evaluations on publicly available datasets demonstrate that the proposed method significantly improves
    registration performance and enhances the interpretability of deep learning-based registration, all while
    maintaining smooth deformations.

- title: "Deep learning-derived arterial input function for dynamic brain PET"
  authors: "Junyu Chen, Zirui Jiang, Jennifer M. Coughlin, Martin G. Pomper, Yong Du"
  venue: "NeuroImage"
  venue_short: "NeuroImage"
  year: 2025
  type: journal
  links:
    paper: "https://www.sciencedirect.com/science/article/pii/S1053811925006123"
    pdf: "https://arxiv.org/pdf/2505.24166"
  image: "pubs/DLIF.jpg"
  image_full: "DLIF.jpg"
  selected: true
  abstract: >-
    Dynamic positron emission tomography (PET) imaging combined with radiotracer kinetic modeling is a powerful
    technique for visualizing biological processes in the brain, offering valuable insights into brain
    functions and neurological disorders such as Alzheimer's and Parkinson's diseases. Accurate kinetic
    modeling relies heavily on the use of a metabolite-corrected arterial input function (AIF), which typically
    requires invasive and labor-intensive arterial blood sampling. While alternative non-invasive approaches
    have been proposed, they often compromise accuracy or still necessitate at least one invasive blood
    sampling. In this study, we present the deep learning-derived arterial input function (DLIF), a deep
    learning framework capable of estimating a metabolite-corrected AIF directly from dynamic PET image
    sequences without any blood sampling. We validated DLIF using existing dynamic PET patient data. We compared
    DLIF and resulting parametric maps against ground truth measurements. Our evaluation shows that DLIF
    achieves accurate and robust AIF estimation. By leveraging deep learning's ability to capture complex
    temporal dynamics and incorporating prior knowledge of typical AIF shapes through basis functions, DLIF
    provides a rapid, accurate, and entirely non-invasive alternative to traditional AIF measurement methods.

- title: "A survey on deep learning in medical image registration: New technologies, uncertainty, evaluation metrics, and beyond"
  authors: "Junyu Chen*, Yihao Liu*, Shuwen Wei*, Zhangxing Bian, Shalini Subramanian, Aaron Carass, Jerry L. Prince, Yong Du"
  authors_note: "* Equal contribution"
  venue: "Medical Image Analysis"
  venue_short: "MedIA"
  year: 2025
  type: journal
  links:
    paper: "https://www.sciencedirect.com/science/article/pii/S1361841524003104"
    pdf: "https://arxiv.org/pdf/2307.15615v4"
    code: "https://github.com/JHU-MedImage-Reg/MedImgReg_Survey"
  image: "pubs/reg_survey.jpg"
  image_full: "reg_survey.jpg"
  selected: true
  abstract: >-
    Deep learning technologies have dramatically reshaped the field of medical image registration over the past
    decade. The initial developments, such as regression-based and U-Net-based networks, established the
    foundation for deep learning in image registration. Subsequent progress has been made in various aspects of
    deep learning-based registration, including similarity measures, deformation regularizations, network
    architectures, and uncertainty estimation. These advancements have not only enriched the field of image
    registration but have also facilitated its application in a wide range of tasks, including atlas
    construction, multi-atlas segmentation, motion estimation, and 2D-3D registration. In this paper, we present
    a comprehensive overview of the most recent advancements in deep learning-based image registration. We
    begin with a concise introduction to the core concepts of deep learning-based image registration. Then, we
    delve into innovative network architectures, loss functions specific to registration, and methods for
    estimating registration uncertainty. Additionally, this paper explores appropriate evaluation metrics for
    assessing the performance of deep learning models in registration tasks. Finally, we highlight the
    practical applications of these novel techniques in medical imaging and discuss the future prospects of
    deep learning-based image registration.

- title: "Vector field attention for deformable image registration"
  authors: "Yihao Liu, Junyu Chen, Lianrui Zuo, Aaron Carass, Jerry L. Prince"
  venue: "Journal of Medical Imaging"
  venue_short: "JMI"
  year: 2024
  type: journal
  links:
    paper: "https://www.spiedigitallibrary.org/journals/journal-of-medical-imaging/volume-11/issue-6/064001/Vector-field-attention-for-deformable-image-registration/10.1117/1.JMI.11.6.064001.full"
    pdf: "https://arxiv.org/pdf/2407.10209"
    code: "https://github.com/yihao6/vfa"
  image: "pubs/VFA.jpg"
  image_full: "VFA.jpg"
  abstract: >-
    Deformable image registration establishes non-linear spatial correspondences between fixed and moving
    images. Deep learning-based deformable registration methods have been widely studied in recent years due to
    their speed advantage over traditional algorithms as well as their better accuracy. Most existing deep
    learning-based methods require neural networks to encode location information in their feature maps and
    predict displacement or deformation fields though convolutional or fully connected layers from these
    high-dimensional feature maps. In this work, we present Vector Field Attention (VFA), a novel framework
    that enhances the efficiency of the existing network design by enabling direct retrieval of location
    correspondences. VFA uses neural networks to extract multi-resolution feature maps from the fixed and moving
    images and then retrieves pixel-level correspondences based on feature similarity. The retrieval is
    achieved with a novel attention module without the need of learnable parameters. VFA is trained end-to-end
    in either a supervised or unsupervised manner. We evaluated VFA for intra- and inter-modality registration
    and for unsupervised and semi-supervised registration using public datasets, and we also evaluated it on
    the Learn2Reg challenge. Experimental results demonstrate the superior performance of VFA compared to
    existing methods.

- title: "On finite difference Jacobian computation in deformable image registration"
  authors: "Yihao Liu, Junyu Chen, Shuwen Wei, Aaron Carass, Jerry L. Prince"
  venue: "International Journal of Computer Vision"
  venue_short: "IJCV"
  year: 2024
  type: journal
  links:
    paper: "https://link.springer.com/article/10.1007/s11263-024-02047-1"
    pdf: "https://arxiv.org/pdf/2212.06060.pdf"
    code: "https://github.com/yihao6/digital_diffeomorphism"
  image: "pubs/digital_diffeomorphism.jpg"
  image_full: "digital_diffeomorphism.jpg"
  abstract: >-
    Producing spatial transformations that are diffeomorphic has been a central problem in deformable image
    registration. As a diffeomorphic transformation should have positive Jacobian determinant |J| everywhere,
    the number of voxels with |J|<0 has been used to test for diffeomorphism and also to measure the
    irregularity of the transformation. For digital transformations, |J| is commonly approximated using central
    difference, but this strategy can yield positive |J|'s for transformations that are clearly not
    diffeomorphic, even at the voxel resolution level. To show this, we first investigate the geometric meaning
    of different finite difference approximations of |J|. We show that to determine diffeomorphism for digital
    images, use of any individual finite difference approximations of |J| is insufficient. We show that for a
    2D transformation, four unique finite difference approximations of |J|'s must be positive to ensure the
    entire domain is invertible and free of folding at the pixel level. We also show that in 3D, ten unique
    finite differences approximations of |J|'s are required to be positive. Our proposed digital diffeomorphism
    criteria solves several errors inherent in the central difference approximation of |J| and accurately
    detects non-diffeomorphic digital transformations.

- title: "Transforming medical imaging with Transformers? A comparative review of key properties, current progresses, and future perspectives"
  authors: "Jun Li*, Junyu Chen*, Yucheng Tang*, Ce Wang, Bennett A. Landman, S. Kevin Zhou"
  authors_note: "* Equal contribution"
  venue: "Medical Image Analysis"
  venue_short: "MedIA"
  year: 2023
  type: journal
  links:
    paper: "https://www.sciencedirect.com/science/article/abs/pii/S1361841523000233"
    pdf: "https://arxiv.org/pdf/2206.01136.pdf"
  image: "pubs/TransSurvey.jpg"
  image_full: "TransSurvey.jpg"
  selected: true
  abstract: >-
    Transformer, one of the latest technological advances of deep learning, has gained prevalence in natural
    language processing or computer vision. Since medical imaging bear some resemblance to computer vision, it
    is natural to inquire about the status quo of Transformers in medical imaging and ask the question: can the
    Transformer models transform medical imaging? In this paper, we attempt to make a response to the inquiry.
    After a brief introduction of the fundamentals of Transformers, especially in comparison with convolutional
    neural networks (CNNs), and highlighting key defining properties that characterize the Transformers, we
    offer a comprehensive review of the state-of-the-art Transformer-based approaches for medical imaging and
    exhibit current research progresses made in the areas of medical image segmentation, recognition,
    detection, registration, reconstruction, enhancement, etc.

- title: "Unsupervised learning of diffeomorphic image registration via TransMorph"
  authors: "Junyu Chen, Eric C. Frey, Yong Du"
  venue: "International Workshop on Biomedical Image Registration (WBIR)"
  venue_short: "WBIR"
  year: 2022
  type: conference
  note: "Long oral presentation"
  links:
    paper: "https://openreview.net/forum?id=uwIo__2xnTO"
    pdf: "https://openreview.net/pdf?id=uwIo__2xnTO"
    code: "https://github.com/junyuchen245/TransMorph_TVF"
  image: "pubs/forward_inverse.jpg"
  image_full: "forward_inverse.jpg"
  abstract: >-
    In this work, we propose a learning-based framework for unsupervised and end-to-end learning of
    diffeomorphic image registration. Specifically, the proposed network learns to produce and integrate
    time-dependent velocity fields in an LDDMM setting. The proposed method guarantees a diffeomorphic
    transformation and allows the transformation to be easily and accurately inverted. We also showed that,
    without explicitly imposing a diffeomorphism, the proposed network can provide a significant performance
    gain while preserving the spatial smoothness in the deformation. The proposed method outperforms the
    state-of-the-art registration methods on two widely used publicly available datasets, indicating its
    effectiveness for image registration.

- title: "TransMorph: Transformer for unsupervised medical image registration"
  authors: "Junyu Chen, Yong Du, Yufan He, William P. Segars, Ye Li, Eric C. Frey"
  venue: "Medical Image Analysis"
  venue_short: "MedIA"
  year: 2022
  type: journal
  note: "Among the journal's top-cited papers"
  links:
    paper: "https://www.sciencedirect.com/science/article/pii/S1361841522002432"
    pdf: "https://arxiv.org/pdf/2111.10480.pdf"
    code: "https://github.com/junyuchen245/TransMorph_Transformer_for_Medical_Image_Registration"
    project: "https://junyuchen.me/TransMorph/"
  image: "pubs/TransMorph.jpg"
  image_full: "TransMorph.jpg"
  selected: true
  abstract: >-
    Transformers may be a strong candidate for image registration because their self-attention mechanism
    enables a more precise comprehension of the spatial correspondence between moving and fixed images. In this
    paper, we present TransMorph, a hybrid Transformer-ConvNet model for volumetric medical image registration.
    We also introduce three variants of TransMorph, with two diffeomorphic variants ensuring the
    topology-preserving deformations and a Bayesian variant producing a well-calibrated registration
    uncertainty estimate.

- title: "A noise-level-aware framework for PET image denoising"
  authors: "Ye Li, Jianan Cui, Junyu Chen, Guodong Zeng, Scott Wollenweber, Floris Jansen, Se-In Jang, Kyungsang Kim, Kuang Gong, Quanzheng Li"
  venue: "arXiv preprint"
  venue_short: "arXiv"
  year: 2022
  type: preprint
  links:
    paper: "https://arxiv.org/abs/2203.08034"
    pdf: "https://arxiv.org/ftp/arxiv/papers/2203/2203.08034.pdf"
  image: "pubs/NoiseLVLAware.jpg"
  image_full: "NoiseLVLAware.jpg"
  abstract: >-
    In PET, the amount of relative (signal-dependent) noise present in different body regions can be
    significantly different and is inherently related to the number of counts present in that region. The
    number of counts in a region depends, in principle and among other factors, on the total administered
    activity, scanner sensitivity, image acquisition duration, radiopharmaceutical tracer uptake in the region,
    and patient local body morphometry surrounding the region. In theory, less amount of denoising operations
    is needed to denoise a high-count (low relative noise) image than images a low-count (high relative noise)
    image, and vice versa. The current deep-learning-based methods for PET image denoising are predominantly
    trained on image appearance only and have no special treatment for images of different noise levels. Our
    hypothesis is that by explicitly providing the local relative noise level of the input image to a deep
    convolutional neural network (DCNN), the DCNN can outperform itself trained on image appearance only. To
    this end, we propose a noise-level-aware framework denoising framework that allows embedding of local noise
    level into a DCNN.

- title: "Targeted gradient descent: A novel method for convolutional neural networks fine-tuning and online-learning"
  authors: "Junyu Chen, Evren Asma, Chung Chan"
  venue: "International Conference on Medical Image Computing and Computer Assisted Intervention (MICCAI)"
  venue_short: "MICCAI"
  year: 2021
  type: conference
  note: "Oral presentation; provisionally accepted (top 13% of 1,630 submissions)"
  links:
    paper: "https://link.springer.com/chapter/10.1007/978-3-030-87199-4_3"
    pdf: "/files/paper1012.pdf"
    supp: "/files/paper1012_suppl_file.pdf"
  code_note: "Code not released (patent pending)."
  image: "pubs/TGD.jpg"
  image_full: "TGD.jpg"
  abstract: >-
    A ConvNet is usually trained and then tested using images drawn from the same distribution. To generalize
    a ConvNet to various tasks often requires a complete training dataset that consists of images drawn from
    different tasks. In most scenarios, it is nearly impossible to collect every possible representative
    dataset as a priori. The new data may only become available after the ConvNet is deployed in clinical
    practice. ConvNet, however, may generate artifacts on out-of-distribution testing samples. In this study,
    we present Targeted Gradient Descent, a novel fine-tuning method that can extend a pre-trained network to a
    new task without revisiting data from the previous task while preserving the knowledge acquired from
    previous training. To a further extent, the proposed method also enables online learning of
    patient-specific data to enhance the network's generalization capability in real-world applications.

- title: "Learning fuzzy clustering for SPECT/CT segmentation via convolutional neural networks"
  authors: "Junyu Chen, Ye Li, Licia P. Luna, Hyun Woo Chung, Steven P. Rowe, Yong Du, Lilja B. Solnes, Eric C. Frey"
  venue: "Medical Physics"
  venue_short: "Med Phys"
  year: 2021
  type: journal
  links:
    paper: "https://aapm.onlinelibrary.wiley.com/doi/10.1002/mp.14903"
    pdf: "https://aapm.onlinelibrary.wiley.com/doi/epdf/10.1002/mp.14903"
    code: "https://github.com/junyuchen245/Semi-supervised_FCM_Loss_for_Segmentation"
    project: "https://junyuchen.me/FCM_loss_for_MedImgSeg/"
  image: "pubs/overview.jpg"
  image_full: "overview.jpg"
  abstract: >-
    We present a new unsupervised segmentation loss function and its semi- and supervised variants for training
    a convolutional neural network (ConvNet). The loss functions were developed based on the objective function
    of the classical Fuzzy C-means (FCM) algorithm. The first proposed loss function can be computed within the
    input image itself without any ground truth labels, and is thus unsupervised; the proposed supervised loss
    function follows the traditional paradigm of the deep learning-based segmentation methods and leverages
    ground truth labels during training. The last loss function is a combination of the first and the second
    and includes a weighting parameter, which enables semi-supervised segmentation using deep learning neural
    network.

- title: "ViT-V-Net: Vision Transformer for unsupervised volumetric medical image registration"
  authors: "Junyu Chen, Yufan He, Eric C. Frey, Ye Li, Yong Du"
  venue: "Medical Imaging with Deep Learning (MIDL)"
  venue_short: "MIDL"
  year: 2021
  type: conference
